sonar.projectKey=alt-formation
sonar.projectName=Alt Formation
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Le jeton est lu depuis SONAR_TOKEN par scripts/run-sonar.mjs. Il ne doit jamais
# etre versionne dans ce fichier.
sonar.sources=src,api,public/api
sonar.tests=tests
sonar.test.inclusions=tests/unit/**/*.test.js,tests/php/**/*_test.php

# Dependances tierces, fichiers de diagnostic local et contenu genere/non source.
sonar.exclusions=**/node_modules/**,**/vendor/**,public/api/PHPMailer/**,public/api/uploads/**,src/assets/**,src/data/json/**

# La couverture unitaire porte sur le coeur deterministe. Les vues/hooks et les
# adaptateurs serveur restent analyses, mais requierent des suites DOM/HTTP separees.
sonar.coverage.exclusions=**/*.jsx,src/main.jsx,src/App.jsx,src/hooks/**,src/shared/hooks/**,src/features/**/hooks/**,src/lib/**,src/data/**,api/**,public/api/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
